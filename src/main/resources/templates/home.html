<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="/fragments/header :: header" />
</head>

<body class="page-shell">

<div th:replace="/fragments/header :: navbar"></div>

<main class="page-main">
    <section class="hero">
        <div class="hero-copy">
            <h1>Explore curated products for every mood.</h1>
            <p>Fast browsing, clean cards, and a smooth shopping experience.</p>
        </div>
    </section>

    <section class="products-section">
        <div class="page-header">
            <h2>Explore Products</h2>
            <p>Find the best items for you</p>
        </div>

        <div class="products-wrapper">
            <div th:replace="/fragments/products :: products"></div>
        </div>

        <div class="pagination-wrapper">
            <div th:replace="/fragments/pagination :: pagination(URLparameter='/home')"></div>
        </div>
    </section>
</main>

<div th:replace="/fragments/footer :: footer"></div>

</body>
</html>
