<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <div th:replace="/fragments/header :: header"></div>

    <!-- Global CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- Navbar -->
<div th:replace="/fragments/header :: navbar"></div>

<!-- Centered Container -->
<div class="center-container">

    <div class="register-card">

        <h2 class="title">Create Account</h2>

        <!-- Success Message -->
        <div class="alert info" th:if="${successMessage}" th:utext="${successMessage}"></div>

        <form autocomplete="off"
              th:action="@{/registration}"
              th:object="${user}"
              method="post">

            <!-- Name -->
            <div class="input-group">
                <input type="text" th:field="*{name}" placeholder="First Name">
                <label class="error"
                       th:if="${#fields.hasErrors('name')}"
                       th:errors="*{name}"></label>
            </div>

            <!-- Last Name -->
            <div class="input-group">
                <input type="text" th:field="*{lastName}" placeholder="Last Name">
                <label class="error"
                       th:if="${#fields.hasErrors('lastName')}"
                       th:errors="*{lastName}"></label>
            </div>

            <!-- Email -->
            <div class="input-group">
                <input type="text" th:field="*{email}" placeholder="Email">
                <label class="error"
                       th:if="${#fields.hasErrors('email')}"
                       th:errors="*{email}"></label>
            </div>

            <!-- Password -->
            <div class="input-group">
                <input type="password" th:field="*{password}" placeholder="Password">
                <label class="error"
                       th:if="${#fields.hasErrors('password')}"
                       th:errors="*{password}"></label>
            </div>

            <!-- Username -->
            <div class="input-group">
                <input type="text" th:field="*{username}" placeholder="Username">
                <label class="error"
                       th:if="${#fields.hasErrors('username')}"
                       th:errors="*{username}"></label>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-primary">Register</button>

        </form>

    </div>

</div>

<!-- Footer -->
<div th:replace="/fragments/footer :: footer"></div>

</body>
</html>
