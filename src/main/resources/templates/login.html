<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="/fragments/header :: header" />
</head>

<body class="page-shell">

<div th:replace="/fragments/header :: navbar"></div>

<main class="auth-page">
    <section class="auth-panel auth-panel--wide">
        <div class="auth-card">
            <div class="auth-card__header">
                <h1 class="title">Welcome to Mini Project</h1>
                <p class="subtitle">Sign in to continue shopping securely.</p>
            </div>

            <form th:action="@{/login}" method="post" class="auth-form">

                <div th:if="${param.error}" class="alert alert-error">
                    Invalid username and password.
                </div>
                <div th:if="${param.roleError}" class="alert alert-error">
                    Selected login type does not match your account role.
                </div>

                <div th:if="${param.logout}" class="alert alert-info">
                    You have been logged out.
                </div>

                <div class="input-group">
                    <input type="text" name="username" id="username"
                           placeholder="Username"
                           required="required" autofocus="autofocus" class="form-control" />
                </div>

                <div class="input-group">
                    <input type="password" name="password" id="password"
                           placeholder="Password"
                           required="required" class="form-control" />
                </div>

                <div class="input-group">
                    <select name="role" class="form-control" required="required">
                        <option value="" disabled="disabled" selected="selected">Select Login Type</option>
                        <option value="ROLE_USER">User</option>
                        <option value="ROLE_ADMIN">Admin</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary btn-submit">Login</button>

                <p class="auth-note">
                    New here? <a th:href="@{/registration}">Create an account</a>
                </p>
            </form>
        </div>
    </section>
</main>

<div th:replace="/fragments/footer :: footer"></div>

</body>
</html>
