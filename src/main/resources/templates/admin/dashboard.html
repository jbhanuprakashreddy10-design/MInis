<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="/fragments/header :: header" />
</head>

<body class="page-shell">

<div th:replace="/fragments/header :: navbar" />

<main class="admin-page">
    <section class="admin-panel">
        <div class="admin-header">
            <h1 class="admin-title">Admin Dashboard</h1>
            <p class="subtitle">Manage products and oversee the store.</p>
        </div>

        <!-- Statistics Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">📦</div>
                <div class="stat-content">
                    <h3 th:text="${totalProducts}">0</h3>
                    <p>Total Products</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-content">
                    <h3 th:text="${totalUsers}">0</h3>
                    <p>Total Users</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🛒</div>
                <div class="stat-content">
                    <h3>0</h3>
                    <p>Total Orders</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">💰</div>
                <div class="stat-content">
                    <h3>₹0</h3>
                    <p>Total Revenue</p>
                </div>
            </div>
        </div>

        <div class="admin-content">
            <!-- Flash Messages -->
            <div th:if="${successMessage}" class="alert alert-success" role="alert">
                <span th:text="${successMessage}"></span>
            </div>

            <!-- Add/Edit Product Form -->
            <div class="admin-section">
                <h2 th:text="${editMode} ? 'Edit Product' : 'Add New Product'"></h2>
                <form th:action="${editMode} ? @{/admin/products/update} : @{/admin/products/add}" th:object="${product}" method="post" class="admin-form">
                    <div class="form-row">
                        <div class="form-group">
                            <input type="text" th:field="*{name}" placeholder="Product Name" class="form-control" required="required" />
                            <label class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></label>
                        </div>
                        <div class="form-group">
                            <input type="text" th:field="*{description}" placeholder="Description" class="form-control" />
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <input type="number" th:field="*{price}" placeholder="Price" step="0.01" min="0" class="form-control" required="required" />
                            <label class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></label>
                        </div>
                        <div class="form-group">
                            <input type="number" th:field="*{quantity}" placeholder="Quantity" min="0" class="form-control" required="required" />
                            <label class="error" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></label>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" th:text="${editMode} ? 'Update Product' : 'Add Product'"></button>
                        <a th:if="${editMode}" href="@{/admin/dashboard}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>

            <!-- Products List -->
            <div class="admin-section">
                <div class="section-header">
                    <h2>All Products</h2>
                    <form th:action="@{/admin/dashboard}" method="get" class="search-form">
                        <input type="text" name="search" th:value="${searchTerm}" placeholder="Search products..." class="search-input" />
                        <button type="submit" class="btn btn-primary btn-sm">Search</button>
                        <a th:if="${searchTerm}" href="@{/admin/dashboard}" class="btn btn-secondary btn-sm">Clear</a>
                    </form>
                </div>
                <div class="products-table">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Description</th>
                                <th>Price</th>
                                <th>Quantity</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td th:text="${product.id}"></td>
                                <td th:text="${product.name}"></td>
                                <td th:text="${product.description}"></td>
                                <td>₹ <span th:text="${product.price}"></span></td>
                                <td th:text="${product.quantity}"></td>
                                <td>
                                    <a th:href="@{'/admin/products/edit/' + ${product.id}}"
                                       class="btn btn-warning btn-sm">Edit</a>
                                    <a th:href="@{'/admin/products/delete/' + ${product.id}}"
                                       class="btn btn-danger btn-sm"
                                       onclick="return confirm('Are you sure you want to delete this product?')">Delete</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- User Management -->
            <div class="admin-section">
                <h2>All Users</h2>
                <div class="users-table">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td th:text="${user.id}"></td>
                                <td th:text="${user.username}"></td>
                                <td th:text="${user.email}"></td>
                                <td>
                                    <span th:each="role : ${user.roles}" th:text="${role.role}"></span>
                                </td>
                                <td>
                                    <span th:class="${user.active == 1} ? 'status-active' : 'status-inactive'"
                                          th:text="${user.active == 1} ? 'Active' : 'Inactive'"></span>
                                </td>
                                <td>
                                    <div class="action-buttons">
                                        <select onchange="changeUserRole(this.value, [[${user.id}]])" class="role-select">
                                            <option th:selected="${user.roles[0].role == 'ROLE_USER'}" value="USER">USER</option>
                                            <option th:selected="${user.roles[0].role == 'ROLE_ADMIN'}" value="ADMIN">ADMIN</option>
                                        </select>
                                        <a th:href="@{'/admin/users/delete/' + ${user.id}}"
                                           class="btn btn-danger btn-sm"
                                           onclick="return confirm('Are you sure you want to delete this user?')">Delete</a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
</main>

<div th:replace="/fragments/footer :: footer" />

<script>
function changeUserRole(role, userId) {
    if (confirm('Are you sure you want to change this user\'s role to ' + role + '?')) {
        window.location.href = '/admin/users/change-role/' + userId + '/' + role;
    } else {
        // Reset the select to its previous value
        location.reload();
    }
}
</script>

</body>
</html>
