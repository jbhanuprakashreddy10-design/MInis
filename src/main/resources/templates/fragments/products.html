<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity4">

<head></head>

<body>

<div th:fragment="products">

    <div class="product-grid">

        <div class="product-card" th:each="product : ${products}">

            <!-- Image (placeholder) -->
            <div class="product-image">
                <img src="https://via.placeholder.com/200" alt="Product Image">
            </div>

            <!-- Product Info -->
            <div class="product-info">

                <h3 th:text="${product.name}">Product Name</h3>

                <p class="desc" th:text="${product.description}">
                    Description
                </p>

                <p class="price">
                    ₹ <span th:text="${product.price}"></span>
                </p>

                <p class="stock">
                    In Stock:
                    <span th:text="${product.quantity}"></span>
                </p>

            </div>

            <!-- Action -->
            <div class="product-action">

                <a th:href="@{'/shoppingCart/addProduct/{id}'(id=${product.id})}"
                   sec:authorize="isAuthenticated()"
                   th:if="${product.quantity} > 0">

                    <button class="btn-buy">Add to Cart</button>
                </a>

                <button class="out-stock"
                        th:if="${product.quantity} == 0"
                        disabled>
                    Out of Stock
                </button>

            </div>

        </div>

    </div>

</div>

</body>
</html>
