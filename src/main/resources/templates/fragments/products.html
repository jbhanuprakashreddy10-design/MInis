<div xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

    <div th:fragment="products">
        <div class="product-grid">
            <div class="product-card" th:each="product : ${products}">
                <div class="product-image">
                    <img src="https://via.placeholder.com/400x260" alt="Product Image" />
                </div>
                <div class="product-info">
                    <h3 th:text="${product.name}">Product Name</h3>
                    <p class="desc" th:text="${product.description}">Description</p>
                    <div class="product-meta">
                        <span class="price">₹ <span th:text="${product.price}"></span></span>
                        <span class="stock">In Stock: <span th:text="${product.quantity}"></span></span>
                    </div>
                </div>
                <div class="product-action">
                    <a th:href="@{'/shoppingCart/addProduct/{id}'(id=${product.id})}"
                       sec:authorize="isAuthenticated()"
                       th:if="${product.quantity} > 0"
                       class="btn btn-primary btn-buy">
                        Add to Cart
                    </a>
                    <button class="btn btn-secondary btn-outstock"
                            th:if="${product.quantity} == 0"
                            disabled="disabled">
                        Out of Stock
                    </button>
                </div>
            </div>
        </div>
    </div>

</div>
