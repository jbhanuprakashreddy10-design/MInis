<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity4">

<head>
    <th:block th:replace="/fragments/header :: header" />
</head>

<body class="page-shell">

<div th:replace="/fragments/header :: navbar"></div>

<main class="cart-page">
    <section class="cart-panel">
        <div class="cart-header">
            <h1 class="cart-title">
                <span sec:authentication="name"></span>'s Shopping Cart
            </h1>
            <p class="subtitle">Review your cart items and proceed to checkout.</p>
        </div>

        <div class="alert alert-error" th:if="${outOfStockMessage}" th:utext="${outOfStockMessage}"></div>

        <div class="cart-layout">
            <div class="cart-list">
                <div class="cart-card" th:each="product : ${products.entrySet()}">
                    <div class="cart-image">
                        <img th:src="${#strings.isEmpty(product.getKey().imageUrl) ? 'https://via.placeholder.com/140x100?text=No+Image' : product.getKey().imageUrl}"
                             th:alt="${product.getKey().name}" />
                    </div>
                    <div class="cart-info">
                        <h3>
                            <a th:text="${product.getKey().name}"
                               th:href="@{'/product/' + ${product.getKey().id}}">
                                Product Name
                            </a>
                        </h3>

                        <p class="desc" th:text="${product.getKey().description}">Description</p>

                        <div class="details">
                            <span>Price: <span th:text="${product.getKey().price}"></span> $</span>
                            <span>Qty: <span th:text="${product.getValue()}"></span></span>
                        </div>
                    </div>

                    <div class="cart-actions">
                        <a th:href="@{'/shoppingCart/removeProduct/{id}'(id=${product.getKey().id})}"
                           class="btn btn-secondary btn-remove">
                            Remove
                        </a>
                    </div>
                </div>
            </div>

            <aside class="cart-summary">
                <h2>Total: <span th:text="${total}"></span></h2>
                <a th:href="@{'/shoppingCart/checkout'}" class="btn btn-primary btn-checkout">Checkout</a>
            </aside>
        </div>
    </section>
</main>

<div th:replace="/fragments/footer :: footer"></div>

</body>
</html>
